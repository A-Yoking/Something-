<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>For You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <canvas id="sky"></canvas>

  <!-- HERO -->
  <section class="hero">
    <p class="eyebrow">a small thing, made for</p>
    <h1 class="hero-name" id="hero-name">Love</h1>
    <p class="hero-line" id="hero-line">Every star here is a moment with you.</p>

    <div class="countdown" id="countdown">
      <div class="countdown-unit"><span id="cd-days">00</span><label>days</label></div>
      <div class="countdown-unit"><span id="cd-hours">00</span><label>hrs</label></div>
      <div class="countdown-unit"><span id="cd-mins">00</span><label>min</label></div>
      <div class="countdown-unit"><span id="cd-secs">00</span><label>sec</label></div>
    </div>
    <p class="countdown-label" id="countdown-label"></p>

    <div class="scroll-hint">
      <span>scroll</span>
      <div class="scroll-line"></div>
    </div>
  </section>

  <!-- LETTER -->
  <section class="letter" id="letter">
    <div class="letter-inner" id="letter-text"></div>
  </section>

  <!-- CONSTELLATION -->
  <section class="constellation-section">
    <p class="section-label">tap each star</p>
    <div class="constellation-wrap">
      <svg id="lines" class="constellation-lines"></svg>
      <div id="stars" class="constellation-stars"></div>
    </div>

    <div class="memory-panel" id="memory-panel">
      <p class="memory-title" id="memory-title">choose a star</p>
      <p class="memory-text" id="memory-text">Every one of them is a moment I've kept.</p>
    </div>
  </section>

  <!-- CLOSING -->
  <section class="closing">
    <p class="closing-line" id="closing-line"></p>
    <p class="signoff" id="signoff"></p>
  </section>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
